<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"><title>chat-bot</title><link rel="stylesheet" href="renderer.css"></head>
<body><main><aside><div class="brand"><img src="icon.png" alt=""><strong>chat-bot</strong></div><div class="intro"><span class="eyebrow">让对话 自然发生</span><h1>你的聊天助手<br>从这里开始</h1><p>连接自己的 QQ 与模型账号<br>在一个窗口中管理聊天 记忆与表达</p><div class="flow"><span>准备组件</span><i></i><span>连接账号</span><i></i><span>开始对话</span></div></div><small>本版本供免费非商业使用</small></aside><section><header><span class="eyebrow">首次配置与组件管理</span><h2 id="heading">准备好 再开始</h2><p>配置保存在这台电脑 安装包不携带任何人的账号</p></header><div class="status" aria-live="polite"><span id="dot"></span><span id="status">正在连接本机服务</span></div><div class="step"><div class="step-number">01</div><div><h3>准备运行组件</h3><p>从官方来源下载并校验 QQ 接入 模型与语音组件</p><label class="consent"><input id="consent" type="checkbox">我确认以非商业用途使用 并了解各组件的许可与账号要求</label><button id="prepare">准备组件<svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button><p id="platform-note" class="note"></p></div></div><div class="step"><div class="step-number">02</div><div><h3>连接你的账号</h3><p>QQ 由本人扫码 模型服务按官方流程在浏览器中登录</p><div class="button-row"><button class="secondary" id="model">模型登录</button><button class="secondary" id="mac" hidden>打开官方 QQ 接入安装器</button><button class="secondary" id="qq" hidden>打开 QQ 登录</button></div></div></div><form id="setup"><div class="step"><div class="step-number">03</div><div><h3>建立本机配置</h3><label>机器人 QQ 号<input id="selfId" name="selfId" inputmode="numeric" autocomplete="off" pattern="[1-9][0-9]{4,19}" required placeholder="填写要登录的 QQ 账号"></label><div class="fields"><label>管理密码<input id="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required placeholder="至少 12 个字符"></label><label>确认密码<input id="confirm" type="password" minlength="12" maxlength="256" autocomplete="new-password" required placeholder="再次输入密码"></label></div><p class="note">初始为干跑模式 设置回复范围并开启真实发送后才会对外回复</p><button id="finish" type="submit" disabled>完成配置 进入管理台<svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></div></div></form><button class="wide secondary" id="open" hidden>进入现有管理台</button><footer><span>关闭窗口后保持托盘运行</span><button class="text" id="clear">卸载与数据清理</button></footer></section></main><script src="renderer.js"></script></body></html>
