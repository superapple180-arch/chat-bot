name: Publish reviewed signed release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '已成功的正式候选构建 run ID'
        type: number
        required: true
      review_json:
        description: '绑定源码摘要与全部安装包摘要的隐私及实机验收记录 JSON'
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/github-script@v7
        id: candidate
        env:
          RELEASE_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const runId = Number(process.env.RELEASE_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId < 1) throw Error('INVALID_RUN_ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            if (run.path !== '.github/workflows/desktop.yml' || run.event !== 'workflow_dispatch' || run.conclusion !== 'success' || run.repository.full_name !== 'superapple180-arch/chat-bot') throw Error('UNTRUSTED_CANDIDATE_RUN');
            core.setOutput('sha', run.head_sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ggshield==1.54.0
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .cache/candidates
      - name: Privacy review and GitGuardian gate then atomic draft publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          CHAT_BOT_PRIVATE_VALUES: ${{ secrets.RELEASE_PRIVATE_VALUES }}
          CHAT_BOT_RELEASE_COMMIT: ${{ steps.candidate.outputs.sha }}
          CHAT_BOT_RELEASE_RUN_ID: ${{ inputs.run_id }}
          CHAT_BOT_RELEASE_REVIEW: ${{ inputs.review_json }}
        run: node scripts/publish-release.mjs .cache/candidates
